image:
  repository: ghcr.io/logangrado/nomen
  tag: v0.2.0
  pullPolicy: IfNotPresent

# Number of web replicas. Note: multiple replicas share the same database,
# but the app has no in-process state so this is safe.
replicaCount: 1

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  host: nomen.local
  # Optional TLS secret name. If set, TLS is enabled for the ingress.
  tlsSecret: ""
  annotations: {}

traefik:
  ingressRoute:
    enabled: false
    entryPoints:
      - websecure
    host: nomen.local
    tls: {}

# Runtime configuration is read from a Kubernetes Secret. Create it before
# installing the chart:
#   kubectl create secret generic nomen-secrets \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/nomen' \
#     --from-literal=SECRET_KEY='...'
env:
  secretName: nomen-secrets
  keys:
    databaseUrl: DATABASE_URL
    secretKey: SECRET_KEY

users:
  user1: ""
  user2: ""

# init.enabled=true runs `nomen init` as a Helm post-install/post-upgrade hook.
# Safe to set on every upgrade — all pipeline functions are idempotent.
init:
  enabled: false
  useHelmHook: true
  ttlSecondsAfterFinished: 600

resources: {}
#  requests:
#    cpu: 100m
#    memory: 256Mi
#  limits:
#    memory: 512Mi
