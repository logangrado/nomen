apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nomen.name" . }}
  labels:
    {{- include "nomen.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nomen.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nomen.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nomen
          image: {{ include "nomen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "nomen.secretEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
