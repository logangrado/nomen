name: Docker cleanup

on:
  pull_request:
    types: [closed]

permissions: read-all

jobs:
  cleanup:
    name: Delete PR image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete ghcr.io/logangrado/nomen:pr-${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          VERSION_ID=$(gh api "/user/packages/container/nomen/versions" \
            --paginate --jq ".[] | select(.metadata.container.tags[] == \"pr-${PR_NUMBER}\") | .id")
          if [ -n "$VERSION_ID" ]; then
            gh api -X DELETE "/user/packages/container/nomen/versions/${VERSION_ID}"
            echo "Deleted pr-${PR_NUMBER} image (version id: ${VERSION_ID})"
          else
            echo "No image found for pr-${PR_NUMBER}, nothing to delete"
          fi
