{# Filter panel — shared by browse and random views.
   Caller must set: form_action, form_target, form_trigger, all_tags, gender, tags, hide_rated #}
<details class="filter-panel" open>
  <summary>Filters</summary>
  <form
    hx-get="{{ form_action }}"
    hx-target="{{ form_target }}"
    hx-trigger="{{ form_trigger }}"
    hx-include="[name='search'], [name='popularity_min'], [name='popularity_max']"
    hx-push-url="true"
  >
    <fieldset>
      <legend>Gender</legend>
      <label>
        <input type="radio" name="gender" value="" {% if not gender %}checked{% endif %}>
        Any
      </label>
      <label>
        <input type="radio" name="gender" value="F" {% if gender == 'F' %}checked{% endif %}>
        Girl (F / MF)
      </label>
      <label>
        <input type="radio" name="gender" value="M" {% if gender == 'M' %}checked{% endif %}>
        Boy (M / MF)
      </label>
    </fieldset>

    <fieldset>
      <legend>Language / Usage</legend>
      <select name="tags" multiple size="6">
        {% for t in all_tags %}
        <option value="{{ t }}" {% if t in tags %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </fieldset>

    <fieldset>
      <legend>Popularity (percentile)</legend>
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <input type="number" name="popularity_min" min="0" max="100" step="1"
               value="{{ popularity_min or '' }}" placeholder="Min" style="width:80px;">
        <span>–</span>
        <input type="number" name="popularity_max" min="0" max="100" step="1"
               value="{{ popularity_max or '' }}" placeholder="Max" style="width:80px;">
      </div>
      <small style="color:#888;">0 = rarest, 100 = most popular</small>
    </fieldset>

    <fieldset>
      <legend>Trend (last 5 years)</legend>
      <label>
        <input type="radio" name="trend" value="" {% if not trend %}checked{% endif %}>
        Any
      </label>
      <label>
        <input type="radio" name="trend" value="rising" {% if trend == 'rising' %}checked{% endif %}>
        Rising ↑
      </label>
      <label>
        <input type="radio" name="trend" value="falling" {% if trend == 'falling' %}checked{% endif %}>
        Falling ↓
      </label>
    </fieldset>

    <label>
      <input type="checkbox" name="hide_rated" value="true" {% if hide_rated %}checked{% endif %}>
      Hide names I've already rated
    </label>
  </form>
</details>
