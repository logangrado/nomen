{# Filter panel — collapsible <details>, closed by default.
   Caller must set: form_action, form_target, form_trigger, gender, tags, hide_rated, trend #}
<details class="filter-panel">
  <summary>Filters</summary>

  <div class="filter-presets">
    <select id="filter-preset-select" aria-label="Load saved filter preset">
      <option value="">— Load preset —</option>
    </select>
    <button type="button" id="filter-preset-delete" class="outline secondary" title="Delete preset">✕</button>
    <span class="filter-presets-sep">|</span>
    <input type="text" id="filter-preset-name" placeholder="Preset name…" aria-label="New preset name">
    <button type="button" id="filter-preset-save" class="outline">Save</button>
  </div>
  <label style="display:flex; align-items:center; gap:0.3rem; font-size:0.85rem; cursor:pointer; margin:0.5rem 0 0;">
    <input type="checkbox" name="hide_rated" value="true" {% if hide_rated %}checked{% endif %}
           style="width:1rem !important; height:1rem !important; margin:0;">
    Hide already rated
  </label>

  <form
    hx-get="{{ form_action }}"
    hx-target="{{ form_target }}"
    hx-trigger="submit"
    hx-include="[name='search'],[name='hide_rated']:checked,[name='conditions'],#current-sort,#current-dir"
    hx-push-url="true"
  >

    {# Advanced condition builder #}
    <div style="margin-top:0.75rem;">
      <div id="cond-rows" style="display:flex; flex-direction:column; gap:0.4rem;"></div>
      <div style="display:flex; gap:0.5rem; align-items:center; margin-top:0.5rem; flex-wrap:wrap;">
        <button type="button" id="cond-add" class="outline secondary" style="font-size:0.82rem; padding:0.2rem 0.6rem; margin:0;">+ Add condition</button>
        <button type="submit" style="font-size:0.82rem; padding:0.2rem 0.8rem; margin:0;">Apply</button>
      </div>
    </div>

    {# Hidden input that carries serialized conditions to server #}
    <input type="hidden" name="conditions" id="cond-json" value="{{ conditions }}">
  </form>
</details>

<script>
(function () {
  const STORAGE_KEY = 'nomen:filter_presets';

  // ── Field definitions mirroring queries._COND_FIELDS ─────────────────
  const TAG_GROUPS = {{ tag_groups | tojson }};
  const ALL_TAGS = {{ all_tags | tojson }};

  const COND_FIELDS = [
    { value: 'region',      label: 'Region',          kind: 'region' },
    { value: 'gender',      label: 'Gender',          kind: 'gender' },
    { value: 'language',    label: 'Language (tag)',  kind: 'language' },
    { value: 'trend',       label: 'Trend (5yr)',     kind: 'trend' },
    { value: 'rank_1yr',    label: 'Rank (1yr)',      kind: 'integer' },
    { value: 'rank_5yr',    label: 'Rank (5yr)',      kind: 'integer' },
    { value: 'rank_10yr',   label: 'Rank (10yr)',     kind: 'integer' },
    { value: 'rank_20yr',   label: 'Rank (20yr)',     kind: 'integer' },
    { value: 'recent_rate', label: 'Rate (recent)',   kind: 'numeric' },
    { value: 'avg_5yr',     label: 'Rate (5yr avg)',  kind: 'numeric' },
    { value: 'avg_10yr',    label: 'Rate (10yr avg)', kind: 'numeric' },
    { value: 'avg_20yr',    label: 'Rate (20yr avg)', kind: 'numeric' },
    { value: 'trend_5yr',   label: 'Slope (5yr)',     kind: 'numeric' },
    { value: 'trend_10yr',  label: 'Slope (10yr)',    kind: 'numeric' },
    { value: 'peak_year',   label: 'Peak year',       kind: 'integer' },
  ];

  const NUM_OPS = [
    { value: 'gte', label: '≥' },
    { value: 'lte', label: '≤' },
    { value: 'gt',  label: '>'  },
    { value: 'lt',  label: '<'  },
    { value: 'eq',  label: '='  },
  ];

  function buildLangPicker(selected_arr) {
    const selected = new Set(selected_arr);

    const wrap = document.createElement('div');
    wrap.className = 'lang-picker';

    const pillArea = document.createElement('div');
    pillArea.className = 'lang-pill-area';

    const searchInp = document.createElement('input');
    searchInp.type = 'text';
    searchInp.placeholder = 'Search languages…';
    searchInp.style.cssText = 'width:100%; font-size:0.82rem; padding:0.2rem 0.3rem; margin:0.3rem 0 0; box-sizing:border-box;';

    const dropdown = document.createElement('div');
    dropdown.className = 'lang-dropdown';
    dropdown.style.display = 'none';

    // Hidden select is the data-cond-val source read by serializeConditions
    const hiddenSel = document.createElement('select');
    hiddenSel.multiple = true;
    hiddenSel.hidden = true;
    hiddenSel.dataset.condVal = '';
    ALL_TAGS.forEach(t => {
      const opt = new Option(t, t, false, selected.has(t));
      hiddenSel.appendChild(opt);
    });

    function syncHidden() {
      [...hiddenSel.options].forEach(o => { o.selected = selected.has(o.value); });
    }

    function renderPills() {
      pillArea.innerHTML = '';
      selected.forEach(tag => {
        const pill = document.createElement('span');
        pill.className = 'tag-pill';
        pill.style.cursor = 'pointer';
        pill.innerHTML = `${tag} <span style="font-size:0.7rem">✕</span>`;
        pill.addEventListener('click', () => {
          selected.delete(tag);
          syncHidden();
          renderPills();
          serializeConditions();
        });
        pillArea.appendChild(pill);
      });
    }

    function renderDropdown(query) {
      const q = query.toLowerCase();
      const matches = ALL_TAGS.filter(t => t.toLowerCase().includes(q) && !selected.has(t));
      dropdown.innerHTML = '';
      if (!matches.length || !query) { dropdown.style.display = 'none'; return; }
      matches.slice(0, 25).forEach(tag => {
        const item = document.createElement('div');
        item.className = 'lang-dropdown-item';
        item.textContent = tag;
        item.addEventListener('mousedown', e => {
          e.preventDefault();
          selected.add(tag);
          syncHidden();
          searchInp.value = '';
          dropdown.style.display = 'none';
          renderPills();
          serializeConditions();
        });
        dropdown.appendChild(item);
      });
      dropdown.style.display = 'block';
    }

    searchInp.addEventListener('input', () => renderDropdown(searchInp.value));
    searchInp.addEventListener('focus', () => { if (searchInp.value) renderDropdown(searchInp.value); });
    searchInp.addEventListener('blur', () => { setTimeout(() => { dropdown.style.display = 'none'; }, 150); });

    renderPills();

    wrap.appendChild(pillArea);
    wrap.appendChild(searchInp);
    wrap.appendChild(dropdown);
    wrap.appendChild(hiddenSel);
    return wrap;
  }

  function buildRow(cond) {
    const row = document.createElement('div');
    row.className = 'cond-row';
    row.style.cssText = 'display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap;';

    const fieldSel = document.createElement('select');
    fieldSel.style.cssText = 'flex:0 1 160px; font-size:0.82rem; padding:0.2rem 0.4rem; margin:0;';
    fieldSel.innerHTML = '<option value="">— Field —</option>' +
      COND_FIELDS.map(f => `<option value="${f.value}"${cond.field === f.value ? ' selected' : ''}>${f.label}</option>`).join('');

    const opSel = document.createElement('select');
    opSel.style.cssText = 'flex:0 1 60px; font-size:0.82rem; padding:0.2rem 0.3rem; margin:0;';

    const valWrap = document.createElement('span');
    valWrap.style.cssText = 'flex:0 1 140px;';

    const rmBtn = document.createElement('button');
    rmBtn.type = 'button';
    rmBtn.textContent = '✕';
    rmBtn.style.cssText = 'flex:none; padding:0.2rem 0.4rem; font-size:0.8rem; margin:0;';
    rmBtn.className = 'outline secondary';
    rmBtn.addEventListener('click', () => { row.remove(); serializeConditions(); });

    function updateForField(fieldVal, existingOp, existingVal) {
      const spec = COND_FIELDS.find(f => f.value === fieldVal);
      const kind = spec ? spec.kind : null;

      if (kind === 'numeric' || kind === 'integer') {
        opSel.innerHTML = NUM_OPS.map(o => `<option value="${o.value}"${existingOp === o.value ? ' selected' : ''}>${o.label}</option>`).join('');
        opSel.hidden = false;
      } else {
        opSel.innerHTML = '';
        opSel.hidden = true;
      }

      valWrap.innerHTML = '';
      if (kind === 'region') {
        const sel = document.createElement('select');
        sel.dataset.condVal = '';
        sel.style.cssText = 'width:100%; font-size:0.82rem; padding:0.2rem 0.3rem; margin:0;';
        sel.innerHTML = TAG_GROUPS.map(g =>
          `<option value="${g}"${existingVal === g ? ' selected' : ''}>${g}</option>`
        ).join('');
        sel.addEventListener('change', serializeConditions);
        valWrap.appendChild(sel);
      } else if (kind === 'gender') {
        const sel = document.createElement('select');
        sel.dataset.condVal = '';
        sel.style.cssText = 'width:100%; font-size:0.82rem; padding:0.2rem 0.3rem; margin:0;';
        sel.innerHTML = '<option value="F"' + (existingVal === 'F' ? ' selected' : '') + '>Female (F/MF)</option>' +
                        '<option value="M"' + (existingVal === 'M' ? ' selected' : '') + '>Male (M/MF)</option>';
        sel.addEventListener('change', serializeConditions);
        valWrap.appendChild(sel);
      } else if (kind === 'trend') {
        const sel = document.createElement('select');
        sel.dataset.condVal = '';
        sel.style.cssText = 'width:100%; font-size:0.82rem; padding:0.2rem 0.3rem; margin:0;';
        sel.innerHTML = '<option value="rising"' + (existingVal === 'rising' ? ' selected' : '') + '>Rising ↑</option>' +
                        '<option value="falling"' + (existingVal === 'falling' ? ' selected' : '') + '>Falling ↓</option>';
        sel.addEventListener('change', serializeConditions);
        valWrap.appendChild(sel);
      } else if (kind === 'language') {
        const existing = existingVal ? (Array.isArray(existingVal) ? existingVal : existingVal.split(',').map(s=>s.trim()).filter(Boolean)) : [];
        valWrap.style.flex = '1 1 220px';
        valWrap.appendChild(buildLangPicker(existing));
      } else if (kind === 'numeric' || kind === 'integer') {
        const inp = document.createElement('input');
        inp.dataset.condVal = '';
        inp.type = 'number';
        if (kind === 'numeric') { inp.step = 'any'; }
        inp.value = existingVal !== undefined ? existingVal : '';
        inp.placeholder = 'value';
        inp.style.cssText = 'width:100%; font-size:0.82rem; padding:0.2rem 0.3rem; margin:0; height:2rem;';
        inp.addEventListener('input', serializeConditions);
        valWrap.appendChild(inp);
      }
    }

    fieldSel.addEventListener('change', () => { updateForField(fieldSel.value, null, null); serializeConditions(); });
    opSel.addEventListener('change', serializeConditions);

    row.appendChild(fieldSel);
    row.appendChild(opSel);
    row.appendChild(valWrap);
    row.appendChild(rmBtn);

    updateForField(cond.field || '', cond.op || '', cond.val !== undefined ? cond.val : '');
    return row;
  }

  function serializeConditions() {
    const rows = document.querySelectorAll('.cond-row');
    const conds = [];
    rows.forEach(row => {
      const fieldSel = row.querySelector('select:first-child');
      const field = fieldSel?.value;
      if (!field) return;
      const spec = COND_FIELDS.find(f => f.value === field);
      const kind = spec ? spec.kind : null;

      let op = '', val = '';

      const valEl = row.querySelector('[data-cond-val]');
      if (kind === 'numeric' || kind === 'integer') {
        op = row.querySelector('select:nth-child(2)')?.value || '';
        val = valEl?.value || '';
        if (!val) return;
      } else if (kind === 'language') {
        val = valEl ? [...valEl.selectedOptions].map(o => o.value).join(',') : '';
        if (!val) return;
      } else {
        val = valEl?.value || '';
      }

      conds.push({ field, op, val });
    });

    const json = conds.length ? JSON.stringify(conds) : '';
    document.getElementById('cond-json').value = json;
  }

  function loadConditions(condStr) {
    const container = document.getElementById('cond-rows');
    container.innerHTML = '';
    let conds = [];
    try { conds = condStr ? JSON.parse(condStr) : []; } catch {}
    conds.forEach(c => container.appendChild(buildRow(c)));
    serializeConditions();
  }

  // ── Presets ───────────────────────────────────────────────────────────

  function getPresets() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  }

  function savePresets(presets) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(presets));
  }

  function readFilters() {
    const panel = document.querySelector('.filter-panel form');
    return {
      hide_rated: panel.querySelector('[name="hide_rated"]')?.checked || false,
      conditions: document.getElementById('cond-json')?.value || '',
    };
  }

  function applyFilters(f) {
    const panel = document.querySelector('.filter-panel form');
    const hr = panel.querySelector('[name="hide_rated"]');
    if (hr) hr.checked = !!f.hide_rated;
    loadConditions(f.conditions || '');
    panel.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function renderSelect() {
    const sel = document.getElementById('filter-preset-select');
    if (!sel) return;
    const presets = getPresets();
    sel.innerHTML = '<option value="">— Load preset —</option>' +
      presets.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
  }

  document.addEventListener('DOMContentLoaded', function () {
    const initialConds = document.getElementById('cond-json')?.value || '';
    if (initialConds) loadConditions(initialConds);

    renderSelect();

    document.getElementById('cond-add')?.addEventListener('click', () => {
      document.getElementById('cond-rows').appendChild(buildRow({}));
    });

    document.getElementById('filter-preset-select')?.addEventListener('change', function () {
      if (!this.value) return;
      const preset = getPresets()[parseInt(this.value)];
      if (preset) applyFilters(preset.filters);
    });

    document.getElementById('filter-preset-save')?.addEventListener('click', function () {
      const nameEl = document.getElementById('filter-preset-name');
      const name = nameEl.value.trim();
      if (!name) { nameEl.focus(); return; }
      const presets = getPresets();
      const existing = presets.findIndex(p => p.name === name);
      if (existing >= 0) {
        presets[existing].filters = readFilters();
      } else {
        presets.push({ name, filters: readFilters() });
      }
      savePresets(presets);
      renderSelect();
      nameEl.value = '';
    });

    document.getElementById('filter-preset-delete')?.addEventListener('click', function () {
      const sel = document.getElementById('filter-preset-select');
      if (!sel.value) return;
      const presets = getPresets();
      presets.splice(parseInt(sel.value), 1);
      savePresets(presets);
      renderSelect();
    });
  });
})();
</script>
