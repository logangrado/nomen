[alembic]
# Path to the migration scripts directory
script_location = alembic

# Template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# as well as the filename. If specified, requires the python>=3.9 or
# backports.zoneinfo library.
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# to be detected as revisions in the versions/ directory
# sourceless = false

# Version location specification; This defaults to alembic/versions.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# Version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new alembic.ini files is "os", which uses
# os.pathsep. Note that this has no effect if only one version_location is present.
# version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.
# version_path_separator = ;   # semicolon is used by alembic default config
# version_path_separator = :   # colon is used in older Alembic configurations
# version_path_separator = space  # use spaces

# The output encoding used when revision files are written from
# script.py.mako; defaults to utf-8
# output_encoding = utf-8

# sqlalchemy.url is intentionally omitted — DATABASE_URL is read from env in env.py

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on
# newly generated revision scripts. See the documentation for further details
# and examples.

# Format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# lint with attempts to fix using "ruff" - use the exec runner, execute a binary
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
